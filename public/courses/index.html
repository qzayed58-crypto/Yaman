<title>الذكاء الاصطناعي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --surface2:#F4F7F8; --ink:#12222B; --muted:#52656E; --line:#D3DDE1;
  --g1:#0E8398; --g2:#084656; --gt:#FFFFFF; --acc:#0B6E7E; --acc-soft:#D9EEF2; --warm:#B8470A; --warm-soft:#FBE6D9; --ok:#17794A; --ok-soft:#DDF3E7;
  --f-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E181E; --surface:#15242C; --surface2:#1B2E37; --ink:#E7EFF2; --muted:#9DB1B9; --line:#2A3F49;
  --g1:#63D3E4; --g2:#2A93A8; --gt:#05232B; --acc:#52C4D6; --acc-soft:#12363E; --warm:#FF9C69; --warm-soft:#3A2214; --ok:#5ED19A; --ok-soft:#133526; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E181E; --surface:#15242C; --surface2:#1B2E37; --ink:#E7EFF2; --muted:#9DB1B9; --line:#2A3F49;
  --g1:#63D3E4; --g2:#2A93A8; --gt:#05232B; --acc:#52C4D6; --acc-soft:#12363E; --warm:#FF9C69; --warm-soft:#3A2214; --ok:#5ED19A; --ok-soft:#133526; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.85;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:780px;margin:0 auto}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:600}
h1,h2,h3{line-height:1.4;text-wrap:balance;margin:0}
.top{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;min-height:38px;padding-inline:104px;margin-bottom:22px}
.brand{font-weight:700;font-size:15px;color:var(--muted)}
.back{position:absolute;inset-inline-end:0;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:14px;font-weight:600;color:var(--acc);padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.hero h1{font-size:clamp(30px,6vw,44px);margin-bottom:10px}
.home-title,.home-sub{text-align:center}
.gate{min-height:calc(100vh - 120px);min-height:calc(100svh - 120px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:20px 0;
  background:radial-gradient(ellipse closest-side at 50% 50%,var(--acc-soft) 0,transparent 100%)}
.orn{display:flex;align-items:center;gap:14px;color:var(--acc);opacity:.9}
.orn i{display:block;width:clamp(40px,14vw,90px);height:2px;background:linear-gradient(90deg,transparent,currentColor)}
.orn i:last-child{transform:scaleX(-1)}
.orn svg{width:34px;height:34px;flex:none}
.gate-btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:min(100%,420px);padding:26px 14px;border-radius:26px;
  background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--gt);font-weight:700;font-size:clamp(20px,5.4vw,30px);line-height:1.3;white-space:nowrap;text-align:center;
  box-shadow:0 14px 34px -12px var(--g2),inset 0 0 0 2px rgba(255,255,255,.28);transition:transform .2s ease,box-shadow .2s ease;isolation:isolate}
.gate-btn::before{content:"";position:absolute;inset:7px;border-radius:19px;border:1.5px dashed currentColor;opacity:.45;pointer-events:none}
.gate-btn svg{width:22px;height:22px;flex:none;opacity:.9}
.gate-btn:hover,.gate-btn:focus-visible{transform:translateY(-3px);box-shadow:0 20px 40px -14px var(--g2),inset 0 0 0 2px rgba(255,255,255,.4)}
.gate-btn:active{transform:translateY(0)}
@media (prefers-reduced-motion:no-preference){.gate-btn{animation:glow 3.2s ease-in-out infinite}}
@keyframes glow{0%,100%{box-shadow:0 14px 34px -12px var(--g2),inset 0 0 0 2px rgba(255,255,255,.28)}50%{box-shadow:0 18px 44px -8px var(--g1),inset 0 0 0 2px rgba(255,255,255,.4)}}

.hero p{color:var(--muted);margin:0 0 24px;font-size:18px}
.lcard{display:flex;gap:16px;align-items:center;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-bottom:14px}
.lcard .n{flex:none;width:48px;height:48px;border-radius:14px;background:var(--acc);color:var(--surface);display:grid;place-items:center;font:700 20px var(--f-mono)}
.lcard h2{font-size:20px}
.lcard .t-en{font-size:14px;color:var(--muted);direction:ltr;text-align:right}
.lcard .d{font-size:15px;color:var(--muted);line-height:1.7;margin-top:4px}
.lcard .arrow{margin-inline-start:auto;color:var(--acc);font-weight:700;font-size:20px}
.note{margin-top:20px;padding:14px 18px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:15px;background:var(--surface)}
.ltitle{font-size:clamp(26px,5.5vw,36px);color:var(--acc)}
.ltitle-en{color:var(--muted);direction:ltr;text-align:right;margin:2px 0 8px;font-size:16px}
.intro{font-size:18px;margin:10px 0 6px}
.sec{margin-top:34px}
.sec>h2{font-size:23px;display:flex;gap:10px;align-items:center;margin-bottom:12px}
.sec>h2 .num{flex:none;width:32px;height:32px;border-radius:10px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font:700 15px var(--f-mono)}
.sec p{margin:0 0 14px}
.term{background:var(--surface);border:1px solid var(--line);border-inline-start:5px solid var(--acc);border-radius:16px;padding:20px;margin:14px 0;display:grid;gap:8px}
.term .w{font-size:26px;direction:ltr;text-align:left;font-weight:700;line-height:1.3}
.term .ar{color:var(--acc);font-weight:700;font-size:20px}
.term .abbr{direction:ltr;text-align:left;font:500 15px var(--f-mono);background:var(--acc-soft);color:var(--acc);padding:6px 12px;border-radius:10px;justify-self:start}
.term .abbr-note{font-size:15px;color:var(--muted)}
.term .def{font-size:17px}
.term .ex{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:16px}
.term .ex b{color:var(--warm)}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;margin:12px 0}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.item .k{direction:ltr;text-align:left;font-weight:700;font-size:18px;color:var(--acc)}
.item .kar{font-weight:600;font-size:15px;margin-bottom:4px}
.item .d{font-size:15.5px;line-height:1.7;color:var(--muted)}
.callout{background:var(--warm-soft);border-radius:14px;padding:16px 18px;margin:16px 0}
.callout b{color:var(--warm);display:block;margin-bottom:4px}
.good{background:var(--ok-soft)} .good b{color:var(--ok)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.cmp>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.cmp h3{font-size:17px;color:var(--acc);margin-bottom:6px}
.cmp ul{margin:0;padding-inline-start:20px;font-size:15.5px;line-height:1.8}
@media (max-width:520px){.cmp{grid-template-columns:1fr}}
.flow{display:grid;gap:8px;margin:14px 0;counter-reset:s}
.flow div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px 12px 16px;display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.flow div::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--surface);display:grid;place-items:center;font:700 14px var(--f-mono)}
.vocab{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:16px}
.vwrap{overflow-x:auto;border-radius:14px;margin:12px 0}
.vocab th{background:var(--acc-soft);color:var(--acc);text-align:start;padding:10px 14px;font-size:14px}
.vocab td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
.vocab td:first-child{direction:ltr;text-align:left;font-weight:700;white-space:nowrap}
.vocab td.s{direction:ltr;text-align:left;font-size:15px;color:var(--muted)}
.lnav{display:flex;justify-content:space-between;gap:10px;margin-top:34px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px var(--f-body)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--surface)}
.prog{margin:18px 0 6px}
.pmeta{font-size:14px;color:var(--muted);margin-bottom:6px;font-weight:600}
.bar{height:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.dots{display:flex;gap:8px;justify-content:center;margin-top:12px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line);padding:0}
.dot.on{background:var(--acc);width:28px;border-radius:999px}
.slide{margin-top:18px}
.lnav{position:sticky;bottom:0;padding:12px 0;background:linear-gradient(transparent,var(--bg) 35%)}
.btn{min-width:130px;justify-content:center}
.chat{display:grid;gap:8px;margin:14px 0}
.chat .lab{font-size:13px;font-weight:700;color:var(--muted)}
.chat .q{display:block;direction:ltr;text-align:left;background:var(--acc-soft);color:var(--ink);border-radius:14px;padding:14px 16px;font-weight:500;font-size:16px}
.chat .r{direction:ltr;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16px;line-height:1.8}
.chat .tr{background:var(--surface2);border-radius:14px;padding:14px 16px;font-size:16px;line-height:1.8}
.checks{display:grid;gap:10px;margin:12px 0}
.chk{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tick{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-weight:700}
.ck{font-weight:700;color:var(--acc)} .cd{font-size:15.5px;color:var(--muted);line-height:1.7}
.code{direction:ltr;text-align:left;font:500 15px/1.7 var(--f-mono);background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;overflow-x:auto;white-space:pre}
.chat.rtl .q,.chat.rtl .r{direction:rtl;text-align:right}
.chat.rtl .q{display:block}
.chips{display:grid;gap:10px;margin:12px 0}
.chip-row{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.chip-row .src{display:block;direction:ltr;text-align:left;font-weight:600}
.toks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;direction:ltr}
.tok{font:500 15px var(--f-mono);background:var(--acc-soft);color:var(--acc);padding:3px 10px;border-radius:8px;border:1px solid var(--acc)}
.cnt{font-size:13px;color:var(--muted);margin-inline-start:6px;direction:rtl}
.notes{background:var(--warm-soft);border:1px dashed var(--warm);border-radius:14px;padding:12px 16px;margin:12px 0}
.notes .nh{font-weight:700;color:var(--warm);font-size:14px;margin-bottom:4px}
.notes ul{margin:0;padding-inline-start:20px;text-align:left;font-size:15.5px;line-height:1.8}
</style>

<div class="wrap" dir="rtl" lang="ar" id="root"></div>

 intro:'في هذا الدرس نبني الأساس: ماذا يعني الذكاء الاصطناعي، وما الاسم الذي يُختصر منه، وأين نراه حولنا، وما المصطلحات العامة التي ستقابلها في كل مكان. وفي آخره مفردات بسيطة تحفظها.',

   {t:'callout', k:'تنبيه', s:'الذكاء الاصطناعي لا يفكّر ولا يشعر مثل الإنسان. هو يتعلّم الأنماط من كميات ضخمة من البيانات، ثم يستخدمها ليعطيك أفضل إجابة محتملة. لذلك قد يخطئ، وعليك أن تراجع عمله.'}

    ['YouTube, Netflix, TikTok','التوصيات','تقترح عليك ما قد يعجبك بناءً على ما شاهدته سابقًا.'],

    ['Spam Filter','فلتر الرسائل المزعجة','يفصل الرسائل المزعجة عن البريد المهم تلقائيًا.']
   ]},
   {t:'p', s:'ومن أبرز استخداماته اليوم: الكتابة والتلخيص، والترجمة، وتعلّم اللغات، وخدمة العملاء، وتحليل الصور الطبية، وإنشاء الصور والفيديو والصوت، وكتابة الأكواد البرمجية.'}
  ]},
  {h:'مصطلحات عامة لا بد منها', b:[

   {t:'term', en:'Deep Learning', ar:'التعلّم العميق', abbr:'DL', abbrNote:'اختصار Deep Learning، وهو فرع من تعلّم الآلة يستخدم شبكات عصبية متعددة الطبقات.',

  {h:'التغيير الكبير: نبرمج بالكلام', b:[
   {t:'p', s:'قبل الذكاء الاصطناعي كان من يريد برنامجًا يجب أن يتعلّم لغة برمجة ويكتب الكود سطرًا سطرًا. أما الآن فيمكنك أن <b>تصف ما تريد بلغتك العادية</b>، ويكتب الذكاء الاصطناعي الكود نيابةً عنك. بل إن اللغة العربية أصبحت مدعومة في كثير من هذه الأدوات.'},
   {t:'cmp', a:{h:'قبل', l:['تتعلّم لغة برمجة أولًا','تكتب الكود بنفسك','تبحث عن الأخطاء يدويًا']}, b:{h:'الآن', l:['تصف ما تريد بالعربية أو الإنجليزية','الذكاء الاصطناعي يكتب الكود','تراجع النتيجة وتطلب التعديل']}},
   {t:'callout', k:'لماذا نحتاج الإنجليزية رغم أن العربية مدعومة؟', cls:'good', s:'لأن الأدوات تعرض ما تفعله وتقترحه بالإنجليزية في الغالب: رسائل الحالة، والأوامر، والأخطاء، والتوثيق. حين تفهم الإنجليزية تستطيع أن تقرأ ما يفعله الذكاء الاصطناعي بدقة، وتتأكد أنه فهم طلبك فعلًا، وتكتب طلباتك بأدق ما يمكن. وهذا ما سنتعلّمه معًا في الدروس القادمة، مصطلحًا بعد مصطلح.'}
  ]},
  {h:'مفردات بسيطة من الدرس', b:[
   {t:'vocab', i:[
    ['Artificial','اصطناعي','Artificial flowers','زهور اصطناعية'],

,{

,{

,{
 ar:'الاسترجاع والضبط الدقيق', en:'Lesson 21: RAG and Fine-tuning',
 d:'كيف يعرف الذكاء الاصطناعي بياناتك الخاصة: بجلبها له وقت السؤال RAG، أو بإعادة تدريبه Fine-tuning، وأيهما تختار.',
 intro:'النموذج لم يقرأ ملفاتك ولا كتب شركتك ولا مستندات مدرستك. فكيف تجعله يجيب منها؟ هناك طريقتان مشهورتان تسمع اسميهما كثيرًا: <span class="en">RAG</span> و<span class="en">Fine-tuning</span>. وسنشرحهما بأمثلة بسيطة.',
 secs:[
  {h:'ما هو RAG؟', b:[
   {t:'term', en:'RAG', ar:'التوليد المعزَّز بالاسترجاع', abbr:'Retrieval-Augmented Generation',
    abbrNote:'RAG اختصار Retrieval-Augmented Generation. <span class="en">Retrieval</span> استرجاع أي جلب المعلومة من مكانها، و<span class="en">Augmented</span> معزَّز أي مدعوم، و<span class="en">Generation</span> توليد أي كتابة الجواب. أي «توليد الجواب معزَّزًا بما جُلب». وتُنطق «راج».',
    def:'أن يبحث البرنامج أولًا في ملفاتك أو مستنداتك عن الأجزاء المتعلقة بسؤالك، ثم يعطيها للنموذج ليكتب جوابه منها.',
    ex:'<b>مثال من حياتك:</b> امتحان <b>الكتاب المفتوح</b>. الطالب لا يحفظ كل شيء، لكنه يفتح الكتاب ويبحث عن الصفحة المناسبة ثم يكتب جوابه منها. فالنموذج هو الطالب، وملفاتك هي الكتاب.'}
  ]},
  {h:'كيف يعمل RAG؟', b:[
   {t:'flow', i:['تسأل','يبحث في ملفاتك','يأخذ الأجزاء المناسبة','يعطيها للنموذج','يكتب الجواب من المصدر']},
   {t:'p', s:'مثال توضيحي. رفعتَ ملف دليل الموظفين، ثم سألتَ:'},
   {t:'reply', q:'According to the employee handbook, how many vacation days do I get?',
    a:['<i>Searching your files…</i>','According to the file "Employee_Handbook.pdf", page 12, you get 21 paid vacation days per year.','Source: Employee_Handbook.pdf, page 12.'],
    ar:['<i>يبحث في ملفاتك…</i>','حسب الملف «Employee_Handbook.pdf» صفحة 12، تحصل على 21 يوم إجازة مدفوعة في السنة.','المصدر: Employee_Handbook.pdf، صفحة 12.']},
   {t:'callout', k:'كيف نقرأ هذه النتيجة؟', s:'الجواب جاء <b>من ملفك</b> وليس من تخمين النموذج، وذكر لك <b>المصدر والصفحة</b> لتتأكد بنفسك. ولهذا يقلّ الاختلاق (الهلوسة). والرقم 21 في المثال مخترع للتوضيح. ولو لم يكن في الملف شيء عن الإجازات لوجب أن يقول لك «لم أجد ذلك في الملف».', cls:'good'}
  ]},

,{

,{

   {t:'reply', q:'The AI made a logo for my shop. Can I use it and sell products with it?',
    a:['Usually you can use it, but I cannot promise it is safe for every case.','Please check these points:','1. The terms of the tool you used: do they allow commercial use?','2. Make sure the logo does not look like an existing brand.','3. For an important business, ask a legal expert in your country.'],
    ar:['غالبًا يمكنك استخدامه، لكن لا أستطيع أن أضمن أنه آمن في كل حالة.','تحقق من هذه النقاط:','1. شروط الأداة التي استعملتَها: هل تسمح بالاستخدام التجاري؟','2. تأكد أن الشعار لا يشبه علامة تجارية موجودة.','3. إن كان العمل مهمًّا فاسأل مختصًّا قانونيًّا في بلدك.']},
   {t:'callout', k:'كيف نقرأ هذه النتيجة؟', s:'الرد لم يعطك «نعم» مطلقة، بل <b>خطوات تحقق</b>، وهذا الصحيح لأن الجواب يتوقف على بلدك وعلى شروط الأداة. وهو مثال توضيحي كتبتُه أنا.', cls:'good'}

  {h:'ما لا يصح طلبه ولا نشره', b:[

    ['Real people','أشخاص حقيقيون','لا تنشر صورة أو صوتًا لشخص حقيقي دون إذنه، خاصة إن كان مزيّفًا ليبدو حقيقيًّا.'],

,{
 ar:'تسجيل الدخول وكيف يعمل', en:'Lesson 30: How Login Works',
 d:'ماذا يحدث حين تكتب بريدك وكلمة مرورك، وإلى أين تذهب بياناتك، وكيف تطلب من الذكاء الاصطناعي لوحة دخول آمنة.',
 intro:'تكتب بريدك وكلمة مرورك وتضغط «دخول»، فتفتح لك صفحتك الخاصة. ماذا حدث في تلك الثواني؟ وأين ذهبت كلمة مرورك؟ وكيف يعرفك الموقع في الصفحات التالية؟ هذا الدرس يشرح الآلية كلها بالترتيب، ثم كيف تطلب لوحة دخول لموقعك.',
 secs:[
  {h:'ما هو تسجيل الدخول؟', b:[
   {t:'term', en:'Authentication', ar:'التحقق من الهوية', abbr:'',
    def:'أن يتأكد الموقع أنك <b>أنت</b> فعلًا صاحب الحساب. وتسجيل الدخول (<span class="en">Login</span> أو <span class="en">Sign in</span>) هو الطريقة المعتادة لذلك.',
    ex:'<b>مثال من حياتك:</b> حين تدخل بنكًا وتُظهر هويتك. الموظف لا يعرف وجهك، فيتأكد أنك صاحب الحساب قبل أن يسمح لك بشيء.'},
   {t:'items', i:[
    ['Sign up','إنشاء حساب','المرة الأولى: تسجّل بياناتك لينشئ الموقع لك حسابًا.'],
    ['Log in / Sign in','تسجيل الدخول','كل مرة بعد ذلك: تثبت أنك صاحب الحساب.'],
    ['Log out / Sign out','تسجيل الخروج','تنهي دخولك فلا يُعرف جهازك بعدها.'],
    ['Authorization','الصلاحية','ما يُسمح لك به بعد أن عُرفتَ. فالعميل يرى طلباته، والمدير يرى كل الطلبات.']
   ]},
   {t:'callout', k:'فرق مهم', s:'<b>التحقق</b> يجيب: «من أنت؟». <b>الصلاحية</b> تجيب: «ماذا يُسمح لك أن تفعل؟». وقد رأينا الصلاحيات في درس سابق.'}
  ]},
  {h:'الخطوات من أولها إلى آخرها', b:[
   {t:'p', s:'حين تضغط «دخول» يحدث هذا بالترتيب:'},
   {t:'items', i:[
    ['1. You type','تكتب بياناتك','بريدك وكلمة مرورك في النموذج.'],
    ['2. Sent securely','تُرسل بأمان','تنتقل من متصفحك إلى خادم الموقع عبر اتصال مشفّر <span class="en">HTTPS</span>.'],
    ['3. Server looks up','الخادم يبحث','يبحث في قاعدة بياناته عن حساب بهذا البريد.'],
    ['4. Compare','يقارن','يتحقق أن كلمة المرور التي كتبتَها تطابق المحفوظة، دون أن يقرأ كلمتك نفسها كما سنرى.'],
    ['5. Decide','يقرر','إن تطابقت سمح لك، وإن لم تتطابق أرجع لك رسالة خطأ.'],
    ['6. Remember you','يتذكرك','يعطي متصفحك «بطاقة دخول» مؤقتة ليعرفك في الصفحات التالية.']
   ]}
  ]},
  {h:'ماذا في الخلف؟ وأين تذهب بياناتك؟', b:[
   {t:'term', en:'Database', ar:'قاعدة البيانات', abbr:'',
    def:'مكان منظّم على خادم الموقع تُحفظ فيه بيانات المستخدمين، مثل الاسم والبريد وكلمة المرور (بصيغة خاصة) وتاريخ إنشاء الحساب.',
    ex:'<b>مثال من حياتك:</b> سجلّ العملاء في دفتر كبير أو جدول، لكل عميل سطر.'},
   {t:'term', en:'Hash', ar:'بصمة مشفّرة (هاش)', abbr:'',
    def:'تحويل كلمة المرور إلى نص طويل مختلف <b>لا يمكن إرجاعه</b> إلى كلمتك الأصلية. فالموقع الجيد <b>لا يحفظ كلمة مرورك نفسها</b> بل بصمتها فقط.',
    ex:'<b>مثال من حياتك:</b> بصمة إصبعك. تُثبت أنك أنت، لكن لا يمكن أن تُصنع منها يدك. وحين تكتب كلمتك يحوّلها الموقع إلى بصمة ويقارن البصمتين.'},
   {t:'callout', k:'ما معنى هذا لك؟', s:'<b>الموقع الجيد لا يعرف كلمة مرورك.</b> وإن اخترق أحدهم قاعدة بياناته وجد بصمات لا كلمات. أما الموقع السيئ الذي يحفظ الكلمة كما هي ويستطيع أن يرسلها لك بالبريد فهو خطر، فلا تثق به.', cls:'good'},
   {t:'p', s:'وبياناتك تذهب إلى <b>خوادم صاحب الموقع</b> أو الخدمة التي يستعملها للدخول. ولذلك اقرأ سياسة الخصوصية لتعرف ما يجمعه عنك وما يفعله به.'}
  ]},
  {h:'كيف يتذكرك الموقع بعد الدخول؟', b:[
   {t:'items', i:[
    ['Session','جلسة','المدة التي يعتبرك الموقع فيها «داخلًا». تنتهي بالخروج أو بمرور الوقت.'],
    ['Cookie','ملف تعريف الارتباط (كوكيز)','ملف صغير يحفظه المتصفح ليعرفك الموقع في كل صفحة دون أن تدخل من جديد.'],
    ['Token (login)','رمز الدخول','بطاقة مؤقتة يعطيها الخادم لمتصفحك تثبت أنك دخلت. وهو غير «الرمز» في درس الرموز.'],
    ['Remember me','تذكّرني','يبقيك داخلًا مدة أطول على هذا الجهاز. لا تستعمله في جهاز عام.']
   ]},
   {t:'callout', k:'لماذا يهم؟', s:'من يسرق «بطاقة الدخول» هذه قد يدخل حسابك دون كلمة مرور. ولذلك اضغط <b>تسجيل الخروج</b> في الأجهزة المشتركة.'}
  ]},
  {h:'طرق أخرى للدخول', b:[
   {t:'items', i:[

    ['OAuth','أو أوث','اختصار <span class="en">Open Authorization</span> أي «التفويض المفتوح». الطريقة التي تسمح بها لموقع باستعمال حسابك في موقع آخر دون كلمة مرورك.'],
    ['One-time code','رمز لمرة واحدة','يصلك برسالة أو بريد وينتهي بسرعة.'],
    ['2FA','تحقق بخطوتين','اختصار <span class="en">Two-Factor Authentication</span>. كلمة المرور مع شيء ثان كرمز يصل هاتفك. ويحميك لو تسرّبت كلمتك.'],
    ['Passkey','مفتاح مرور','تدخل ببصمة إصبعك أو وجهك أو قفل جهازك دون كلمة مرور.']
   ]}
  ]},
  {h:'اطلب لوحة تسجيل دخول من الذكاء الاصطناعي', b:[
   {t:'p', s:'يمكنك أن تطلب لموقعك لوحة دخول. ولا تنسَ الأهم: <b>اطلب منه خدمة دخول جاهزة وموثوقة</b>، ولا تطلب أن يصنع نظام حماية من الصفر. مثال توضيحي:'},
   {t:'reply', q:'Create a login panel for my website: a Sign up form, a Log in form, and a Log out button. Use a trusted ready-made login service. Do not store passwords in plain text. Tell me what I need to set up myself.',
    a:['Here is what I built:','1. A Sign up form with name, email and password.','2. A Log in form with email and password.','3. A Log out button that appears after login.','I used a trusted login service, so passwords are stored securely by it and not in plain text.','What you need to do: create a free account on that service, create a project, and paste its public key in the settings. Never put a secret key inside the page.','Please test it first with a fake email.'],
    ar:['هذا ما بنيتُه:','1. نموذج إنشاء حساب بالاسم والبريد وكلمة المرور.','2. نموذج تسجيل دخول بالبريد وكلمة المرور.','3. زر تسجيل خروج يظهر بعد الدخول.','استعملتُ خدمة دخول موثوقة، فكلمات المرور تحفظها هي بأمان وليس بنص صريح.','المطلوب منك: أنشئ حسابًا مجانيًّا على تلك الخدمة، وأنشئ مشروعًا، والصق مفتاحها العام في الإعدادات. ولا تضع مفتاحًا سريًّا داخل الصفحة.','جرّبه أولًا ببريد وهمي من فضلك.']},
   {t:'p', s:'والآن نتحقق: هل ظهر كل ما طلبتَه؟'},
   {t:'checks', i:[
    ['Sign up form','نموذج إنشاء حساب','ظهر: «A Sign up form».'],
    ['Log in form','نموذج دخول','ظهر: «A Log in form».'],
    ['Log out button','زر خروج','ظهر: «A Log out button».'],
    ['Trusted service','خدمة موثوقة','ظهر: «trusted login service».'],
    ['No plain-text passwords','لا نص صريح لكلمات المرور','ظهر: «not in plain text».'],
    ['What I must set up','ما أحتاج إعداده','ظهر: «create a free account… paste its public key».']
   ]},
   {t:'callout', k:'ملاحظة', s:'الرد مثال كتبتُه أنا، وليس مخرجًا حقيقيًّا. وما يحتاج إعداده فعلًا يختلف باختلاف الخدمة التي يختارها برنامجك.'}
  ]},
  {h:'تنبيه: الدخول لا يُصنع في الصفحة وحدها', b:[
   {t:'callout', k:'مهم جدًّا', s:'لوحة الدخول التي تُكتب <b>داخل الصفحة فقط</b> (بلا خادم ولا قاعدة بيانات ولا خدمة دخول) هي <b>شكل بلا حماية</b>. أي زائر يستطيع أن يقرأ كودها ويتجاوزها. فالتحقق الحقيقي يجب أن يتم في <b>خادم</b> أو في <b>خدمة دخول جاهزة</b>.'},
   {t:'checks', i:[
    ['Use a ready service','استعمل خدمة جاهزة','أقل خطرًا من صنع نظام بنفسك.'],
    ['Ask for hashing','اطلب تشفير كلمات المرور','ولا تقبل حفظها نصًّا صريحًا.'],
    ['HTTPS only','HTTPS فقط','تأكد من قفل الأمان عند نشر الموقع.'],
    ['Keep secrets out','أبعد المفاتيح السرية','لا تضعها في الصفحة ولا في مستودع عام.'],
    ['Collect little','اجمع أقل بيانات','لا تطلب من الناس إلا ما تحتاجه فعلًا.'],
    ['Test with fake data','جرّب بيانات وهمية','لا تختبر ببياناتك الحقيقية.']
   ]},
   {t:'p', s:'<b>ولحماية حسابك أنت كمستخدم:</b> كلمة مرور طويلة مختلفة لكل موقع، وفعّل التحقق بخطوتين، ولا تشاركها مع أحد، حتى مع الذكاء الاصطناعي.'}
  ]},
  {h:'مفردات بسيطة من الدرس', b:[
   {t:'vocab', i:[
    ['Login','تسجيل دخول','The login page','صفحة تسجيل الدخول'],
    ['Sign up','ينشئ حسابًا','Sign up for free','ينشئ حسابًا مجانًا'],
    ['Log out','يخرج','Log out now','يسجّل الخروج الآن'],
    ['Account','حساب','Create an account','ينشئ حسابًا'],

var root = document.getElementById('root');
function vocabHTML(items){
  return '<div class="vwrap"><table class="vocab"><thead><tr><th>الكلمة</th><th>المعنى</th><th>مثال</th></tr></thead><tbody>' +
   items.map(function(r){ return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td class="s">'+r[2]+'<br><span style="direction:rtl;display:inline-block;font-family:var(--f-body)">'+r[3]+'</span></td></tr>'; }).join('') + '</tbody></table></div>';
}
function block(b){
  switch(b.t){
   case 'p': return '<p>'+b.s+'</p>';
   case 'term':
    return '<article class="term"><div class="w">'+b.en+'</div><div class="ar">'+b.ar+'</div>' +
      (b.abbr ? '<div class="abbr">'+b.abbr+'</div><div class="abbr-note">'+b.abbrNote+'</div>' : '') +
      '<div class="def">'+b.def+'</div>' + (b.ex ? '<div class="ex">'+b.ex+'</div>' : '') + '</article>';
   case 'items':
    return '<div class="items">'+b.i.map(function(x){ return '<div class="item"><div class="k">'+x[0]+'</div><div class="kar">'+x[1]+'</div><div class="d">'+x[2]+'</div></div>'; }).join('')+'</div>';
   case 'callout':
    return '<div class="callout '+(b.cls||'')+'"><b>'+b.k+'</b>'+b.s+'</div>';
   case 'cmp':
    return '<div class="cmp"><div><h3>'+b.a.h+'</h3><ul>'+b.a.l.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div><div><h3>'+b.b.h+'</h3><ul>'+b.b.l.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div></div>';
   case 'flow':
    return '<div class="flow">'+b.i.map(function(x){ return '<div><span>'+x+'</span></div>'; }).join('')+'</div>';
   case 'vocab': return vocabHTML(b.i);
   case 'reply':
    return '<div class="chat'+(b.rtl?' rtl':'')+'"><div class="lab">أمرك</div><div class="q en">'+b.q+'</div><div class="lab">رد الذكاء الاصطناعي</div><div class="r">'+b.a.map(function(x){return '<div>'+x+'</div>';}).join('')+'</div>'+(b.ar?'<div class="lab">الترجمة</div><div class="tr">'+b.ar.map(function(x){return '<div>'+x+'</div>';}).join('')+'</div>':'')+'</div>';
   case 'reply1':
    return '<div class="chat"><div class="lab">أمرك</div><div class="q en">'+b.q+'</div></div>';
   case 'code':
    return '<pre class="code" dir="ltr">'+b.l.map(function(x){return x.replace(/&/g,'&amp;').replace(/</g,'&lt;');}).join('\n')+'</pre>';
   case 'chips':
    return '<div class="chips">'+b.i.map(function(x){ return '<div class="chip-row"><div class="src en">'+x[0]+'</div><div class="toks">'+x[1].map(function(t){return '<span class="tok">'+t+'</span>';}).join('')+'<span class="cnt">'+x[1].length+' رموز</span></div></div>'; }).join('')+'</div>';
   case 'notes':
    return '<div class="notes"><div class="nh">'+b.h+'</div><ul dir="ltr">'+b.l.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div>';
   case 'checks':
    return '<div class="checks">'+b.i.map(function(x){ return '<div class="chk"><span class="tick">✓</span><div><div class="ck"><span class="en">'+x[0]+'</span> · '+x[1]+'</div><div class="cd">'+x[2]+'</div></div></div>'; }).join('')+'</div>';
  }
  return '';
}

function viewLesson(n,c){
  var l = L[n-1]; if(!l){ location.hash='#lessons'; return; }
  var N = l.secs.length; c = Math.max(1, Math.min(N, c||1));
  var s = l.secs[c-1];
  var h = '<div class="top"><span class="brand">'+l.ar+'</span><a class="back" href="#lessons">كل الدروس</a></div>';
  if(c===1) h += '<div class="ltitle-en">'+l.en+'</div><p class="intro">'+l.intro+'</p>';
  h += '<div class="prog"><div class="pmeta"><span>بطاقة '+c+' من '+N+'</span></div><div class="bar"><i style="width:'+(c*100/N)+'%"></i></div>' +
       '<div class="dots">'+l.secs.map(function(_,i){ return '<a href="#l'+n+'-c'+(i+1)+'" class="dot'+(i+1===c?' on':'')+'" aria-label="بطاقة '+(i+1)+'"></a>'; }).join('')+'</div></div>';
  h += '<section class="sec slide"><h2><span class="num">'+c+'</span>'+s.h+'</h2>' + s.b.map(block).join('') + '</section>';
  var prev = c>1 ? '#l'+n+'-c'+(c-1) : null;
  var next = c<N ? '#l'+n+'-c'+(c+1) : null;
  var last = (n===L.length && c===N);
  if(last) next = '#bye';
  var nlabel = c<N ? 'التالي ←' : (last ? 'كلمة الختام ←' : 'كل الدروس');
  h += '<div class="lnav">' + (prev ? '<a class="btn" id="pv" href="'+prev+'">→ السابق</a>' : '<span></span>') +
       '<a class="btn primary" id="nx" href="'+(next||'#lessons')+'">'+nlabel+'</a></div>';
  root.innerHTML = h;
}

function route(){
  var m = (location.hash||'').match(/^#l(\d+)(?:-c(\d+))?$/);
  window.scrollTo(0,0);
  var hsh=(location.hash||'');
  if(m) viewLesson(+m[1], m[2]?+m[2]:1); else if(hsh==='#bye') viewBye(); else if(hsh==='#lessons') viewLessons(); else viewHome();
}
document.addEventListener('keydown', function(e){
  // RTL: left arrow = next, right arrow = previous
  var t = e.key==='ArrowLeft' ? document.getElementById('nx') : e.key==='ArrowRight' ? document.getElementById('pv') : null;
  if(t) location.hash = t.getAttribute('href');
});
window.addEventListener('hashchange', route);
